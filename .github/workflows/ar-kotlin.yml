name: AR Kotlin rigor

on:
  pull_request:
    paths:
      - "ar-kotlin/**"
      - ".github/workflows/ar-kotlin.yml"
  push:
    branches: [main]
    paths:
      - "ar-kotlin/**"
      - ".github/workflows/ar-kotlin.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ar-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Run rigorous-core tests
        run: gradle --no-daemon test
      - name: Compile tactical Compose UI
        run: gradle --no-daemon :composeApp:compileKotlin
