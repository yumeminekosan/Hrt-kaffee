name: AR Kotlin rigor

on:
  pull_request:
    paths:
      - "ar-kotlin/**"
      - ".github/workflows/ar-kotlin.yml"
  push:
    branches:
      - main
      - agent/ar-kotlin-wasm-demo
    paths:
      - "ar-kotlin/**"
      - ".github/workflows/ar-kotlin.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ar-kotlin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Verify exact models and compile every UI target
        run: >-
          gradle --no-daemon
          test
          :composeApp:compileKotlin
          :webApp:jvmTest
          :webApp:wasmJsBrowserDistribution
          :embeddedEngine:jvmTest
          :embeddedEngine:jsBrowserDistribution
      - name: Upload browser distribution
        uses: actions/upload-artifact@v6
        with:
          name: hrt-kaffee-ar-web
          path: |
            ar-kotlin/webApp/build/dist/wasmJs/productionExecutable
            ar-kotlin/embeddedEngine/build/dist/js/productionExecutable
          if-no-files-found: error
          retention-days: 7
