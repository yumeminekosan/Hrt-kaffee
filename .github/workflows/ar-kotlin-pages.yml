name: Deploy AR Kotlin/Wasm demo

on:
  push:
    branches: [main]
    paths:
      - "ar-kotlin/**"
      - "public/**"
      - ".github/workflows/ar-kotlin-pages.yml"
  pull_request:
    paths:
      - "ar-kotlin/**"
      - "public/**"
      - ".github/workflows/ar-kotlin-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ar-kotlin-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Verify exact browser/JVM parity and build Wasm
        working-directory: ar-kotlin
        run: >-
          gradle --no-daemon
          :rigor-core:test
          :webApp:jvmTest
          :webApp:wasmJsBrowserDistribution
      - name: Assemble Pages site
        run: |
          mkdir -p _site/ar
          cp -R public/. _site/
          cp public/pkpd-simulator-v3.html _site/index.html
          cp -R ar-kotlin/webApp/build/dist/wasmJs/productionExecutable/. _site/ar/
          test -f _site/index.html
          test -f _site/ar/index.html
          grep -q 'HRT-KAFFEE' _site/index.html
          grep -q 'href="ar/"' _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
